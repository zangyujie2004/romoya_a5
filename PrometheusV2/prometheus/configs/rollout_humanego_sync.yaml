defaults:
  - robot: x5_2_humanego
  - task: default
  - policy: humanego
  - _self_

run:
  id: ${now:%Y%m%d_%H%M%S}
  output_dir: outputs/rollout_humanego_sync/${task.id}/${run.id}
  runtime_dir: ${run.output_dir}/runtime
  wait_ready_timeout_s: 5.0
  steps: 1

hardware:
  name: hardware
  mode: owned
  sensors: auto
  streams: auto

data:
  name: data
  mode: owned
  history: 32
  bridge:
    enabled: true
    name: ros_data
    wait_all_streams: true
    qos_depth: 10
  recording:
    enabled: false
    queue_size: 4096

policy_session:
  name: policy
  mode: owned

scheduler:
  _target_: prometheus.policy.scheduler.ActionScheduler
  dry_run: true
  wait: true
  timeout_s: 3.0
  history: 1024
  filters: []

workflow:
  stop_on_done: true

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/rollout_humanego_sync/${run.id}
