# @package _global_
defaults:
  - /robot: x5_1_fm
  - /task: default
  - /policy: fm
  - /event: dagger_pedal
  - _self_

user:
  task_id: chahua-test
  dagger_root: /home/wujie/workspace/raw_data/dagger
  policy_run_dir: /home/wujie/workspace/inference/PrometheusV2/third_party/flow_matching/outputs/base_peel/chahua_eef_vision_view_2
  dry_run: false
  action_space: abs_eef
  action_hz: 30.0
  n_action_steps: 32
  use_memory: true
  memory_feed_hz: 30.0
  memory_warning_lag_ms: 300.0
  memory_max_lag_ms: 500.0
  memory_ready_timeout_ms: 5000.0
  cycle_wait_s: 5
  realtime_vis: true

task:
  id: ${user.task_id}

run:
  id: ${now:%Y%m%d_%H%M%S_%f}
  output_dir: ${user.dagger_root}/${task.id}/${run.id}
  runtime_dir: ${run.output_dir}/runtime
  wait_ready_timeout_s: 5.0

dagger:
  cycle_wait_s: ${user.cycle_wait_s}
  control_hz: ${user.action_hz}
  reset_home_timeout_s: 30.0
  event_name: event_label

robot:
  robot:
    action_space: ${user.action_space}
    state_publish_hz: ${user.action_hz}

policy:
  action_hz: ${user.action_hz}
  inference:
    run_dir: ${user.policy_run_dir}
    n_action_steps: ${user.n_action_steps}
    use_memory: ${user.use_memory}
    memory_feed_hz: ${user.memory_feed_hz}
    memory_warning_lag_ms: ${user.memory_warning_lag_ms}
    memory_max_lag_ms: ${user.memory_max_lag_ms}
    memory_ready_timeout_ms: ${user.memory_ready_timeout_ms}

hardware:
  name: hardware
  mode: owned
  sensors: auto
  streams: auto

data:
  name: data
  mode: owned
  history: 64
  bridge:
    enabled: true
    name: ros_data
    wait_all_streams: true
    qos_depth: 10
    stamp_source: recv
    print_camera_timestamps: false
    print_camera_rates: false
    camera_rate_report_s: 2.0
  numpy:
    enabled: true
    history: 64
    recording:
      enabled: false
  timing:
    enabled: true
    path: ${run.runtime_dir}/data_timing.jsonl
  recording:
    enabled: true
    output_dir: ${run.output_dir}/corrections
    queue_size: 4096
    fps: ${user.action_hz}
    default_event_value: 0
    enable_plots: true

policy_session:
  name: policy
  mode: owned

scheduler:
  _target_: prometheus.policy.scheduler.ActionScheduler
  dry_run: ${user.dry_run}
  wait: true
  timeout_s: 3.0
  history: 1024
  filters: []

workflow:
  interrupt_accept_active_episode: false
  realtime_vis: ${user.realtime_vis}
  realtime_vis_cfg:
    window: "DAgger Preview"
    width: 1280
    height: 720
    fps: 12
    stale_timeout_s: 1.0
    max_poll_ms: 2.0

ros:
  localhost_only: true

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/rollout_dagger/${run.id}
