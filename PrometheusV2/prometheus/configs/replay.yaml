defaults:
  - robot: x5_1
  - task: default
  - _self_

user:
  task_id: default
  input: /home/wujie/workspace/raw_data/prometheus/ningkai_bottle_0708/0000/robot/robot_state_dict.pkl

  control_mode: joint
  action_hz: 30.0
  dry_run: true

task:
  id: ${user.task_id}

run:
  id: ${now:%Y%m%d_%H%M%S}
  output_dir: outputs/replay/${task.id}/${run.id}
  runtime_dir: ${run.output_dir}/runtime
  wait_ready_timeout_s: 5.0

hardware:
  name: hardware
  mode: owned
  sensors: {}
  streams: {}

scheduler:
  _target_: prometheus.policy.scheduler.ActionScheduler
  dry_run: ${user.dry_run}
  wait: true
  timeout_s: 3.0
  history: 1024
  filters: []

workflow:
  input: ${user.input}
  control_mode: ${user.control_mode}
  action_hz: ${user.action_hz}
  reset_home_timeout_s: 30.0

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/replay/${run.id}
