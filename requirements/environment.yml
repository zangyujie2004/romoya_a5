name: prometheusv3
channels:
  - conda-forge
  - robostack-jazzy
  - nodefaults
dependencies:
  - python=3.12
  - hydra-core>=1.3,<1.4
  - msgpack-python>=1.0
  - omegaconf>=2.3,<2.4
  - numpy>=1.26,<2
  - libopencv=4.11
  - py-opencv=4.11
  - pytest>=8
  - websockets>=12
  # Vendor A5 SDK still links KDL parser libraries; framework IPC uses ZMQ.
  - ros-jazzy-kdl-parser
  - pyzmq
  - scipy
  - pybind11
  - pip
