defaults:
  - task: default
  - _self_

run:
  id: ${now:%Y%m%d_%H%M%S}
  output_dir: outputs/rollout_sync/${task.id}/${run.id}
  runtime_dir: ${run.output_dir}/runtime
  wait_ready_timeout_s: 1.0
  steps: 3

hardware:
  name: hardware
  mode: owned
  sensors: {}
  streams: {}

data:
  name: data
  mode: owned
  history: 32
  bridge:
    enabled: true
    name: zmq_data
    wait_all_streams: true
    qos_depth: 10
  recording:
    enabled: false
    queue_size: 4096

policy:
  _target_: ???

policy_session:
  name: policy
  mode: owned

scheduler:
  _target_: prometheus.policy.scheduler.ActionScheduler
  dry_run: true
  wait: true
  timeout_s: 3.0
  history: 1024
  filters: []

workflow:
  data_cpu_affinity: null  # Optional CPU set for data / inference, applied before model loading.
  stop_on_done: true

transport:
  backend: zmq
  namespace: ${oc.env:PROMETHEUS_ZMQ_NAMESPACE,prometheus-v3}

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/rollout_sync/${run.id}
