defaults:
  - robot: x5_1_fm
  - task: default
  - _self_

user:
  # Operators should normally only edit this block.
  task_id: default
  collect_root: /home/wujie/workspace/raw_data/test
  log_root: /tmp/prometheus_logs
  max_episodes: 25

task:
  id: ${user.task_id}

ros:
  localhost_only: true

robot:
  robot:
    state_publish_hz: 120
  cameras:
    ir: true
    prepub_resize: 1.0
    qos: reliable
    camera_info: false
  tactile:
    publish_difference: true
    publish_raw: false

run:
  id: ${now:%Y%m%d_%H%M%S_%f}
  output_dir: ${user.log_root}/collect/${task.id}/${run.id}
  runtime_dir: ${run.output_dir}/runtime
  wait_ready_timeout_s: 5.0

hardware:
  name: hardware
  mode: owned
  sensors: auto
  streams: auto

data:
  name: data
  mode: owned
  history: 32
  bridge:
    enabled: true
    name: ros_data
    wait_all_streams: true
    qos_depth: 10
    sensor_qos: reliable
    stamp_source: header
    print_camera_timestamps: false
    print_camera_rates: false
  numpy:
    enabled: false
  recording:
    enabled: true
    output_dir: ${user.collect_root}/${task.id}
    queue_size: 4096
    fps: 30.0
    default_event_value: null
    enable_plots: true
    joint_plot_ranges:
      - [-3.14, 2.618]
      - [-0.05, 3.50]
      - [-0.10, 3.20]
      - [-1.60, 1.55]
      - [-1.57, 1.57]
      - [-2.00, 2.00]
      - [-0.005, 0.09]

event:
  name: event
  mode: owned
  input_source: pedal,tty

workflow:
  max_episodes: ${user.max_episodes}
  event_wait_timeout_s: 0.1
  reset_after_episode:
    enabled: true
    timeout_s: 30.0
  preview:
    enabled: true
    mode: local
    window: Prometheus Collection Preview
    width: 1280
    height: 720
    fps: 20
    stale_timeout_s: 1.0
    host: 127.0.0.1
    port: 7860
    refresh_ms: 100
  events: []

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/collect/${run.id}
