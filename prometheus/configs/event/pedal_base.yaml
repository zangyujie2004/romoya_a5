pedal:
  device: /dev/input/prometheus-pedal
  confirm_presses: 2
  confirm_window_s: 1.0
  debounce_s: 0.25
  poll_timeout_s: 0.02
  pedal_map:
    30: 0
    48: 1
    46: 2

tty:
  confirm_presses: 2
  confirm_window_s: 1.0
  debounce_s: 0.25
  poll_timeout_s: 0.02
  key_map:
    a: 0
    b: 1
    c: 2
